name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (örn. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/AirDrop-Android-${TAG}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # workflow_dispatch ile çalıştığında tag henüz yoktur; gh, release'i
          # oluştururken tag'i bu commit üzerinde kendisi yaratır.
          gh release create "$TAG" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "AirDrop for Android $TAG" \
            --notes-file .github/RELEASE_NOTES.md
